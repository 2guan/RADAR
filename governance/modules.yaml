      "public_contracts": ["governance/modules.yaml", "docs/governance/**"],
      "allowed_dependencies": ["shared/contracts"],
      "ai_default_access": "read_write", "risk": "high", "shared_change_required": true
    },
    "platform/auth": {
      "type": "platform", "description": "认证、会话和 RBAC",
      "owners": {"primary": "hengguan", "backup": "hengguan", "approvers": ["hengguan"]},
