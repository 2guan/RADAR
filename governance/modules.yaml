      "public_contracts": ["server/src/platform/audit/index.js", "server/src/platform/audit/contracts/**"],
      "allowed_dependencies": ["platform/auth", "platform/persistence", "platform/runtime", "shared/contracts"],
      "ai_default_access": "read_only", "risk": "high", "shared_change_required": true
