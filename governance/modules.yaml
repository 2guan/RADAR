  "shared_change_policy": {
    "issue_required": true, "one_active_change_per_public_contract": true,
    "preserve_existing_method_semantics": true, "prefer_new_semantic_method": true,
    "forbid_versioned_method_names": ["*V2", "*V3", "*New"],
    "require_old_behavior_regression_tests": true, "require_owner_approval": true
  }
