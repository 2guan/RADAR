name: AI Scope Check

on:
  pull_request:

jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve namespaced requirement scope from PR
        id: requirement
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          requirement_id=$(printf '%s\n%s' "$TITLE" "$BODY" | grep -oE 'REQ-[0-9]{8}-[0-9]{3}' | head -1 || true)
          test -n "$requirement_id"
          printf '%s\n' "$HEAD_REF" | grep -Eq '^[a-z0-9][a-z0-9-]*/REQ-[0-9]{8}-[0-9]{3}-[a-z0-9-]+$'
          developer=${HEAD_REF%%/*}
          requirement_ref="$developer/$requirement_id"
          printf '%s\n%s' "$TITLE" "$BODY" | grep -Fq "$requirement_ref"
          scope="docs/requirements/$developer/$requirement_id/ai-task-scope.yaml"
          test -f "$scope"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
      - name: Enforce changed files against AI task scope
        run: node scripts/check-ai-scope.mjs --scope "${{ steps.requirement.outputs.scope }}" --base "origin/${{ github.base_ref }}" --head HEAD
