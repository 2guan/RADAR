name: Module Boundary Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-module-boundaries.mjs
      - run: node scripts/check-migration-parity.mjs
      - run: node scripts/check-mysql8-migrations.mjs

