<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>kkFileView 本机预览演示</title>
    <style>
      :root { color: #172033; background: #f3f6fb; font-family: Inter, "PingFang SC", system-ui, sans-serif; }
      body { margin: 0; min-width: 320px; }
      main { max-width: 1120px; margin: 0 auto; padding: 40px 24px; }
      h1 { margin: 0 0 10px; font-size: 28px; } p { color: #536079; line-height: 1.6; }
      .panel { background: white; border: 1px solid #dbe3f1; box-shadow: 0 8px 26px #1d2b4a12; border-radius: 14px; padding: 20px; margin-top: 20px; }
      .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      input { max-width: 100%; } button { border: 0; border-radius: 8px; background: #1769e0; color: #fff; padding: 9px 15px; cursor: pointer; font-size: 14px; }
      button:disabled { opacity: .6; cursor: wait; } #status { min-height: 24px; margin: 14px 0 0; color: #536079; } #status.error { color: #bb2525; }
      iframe { width: 100%; height: min(74vh, 760px); border: 1px solid #dbe3f1; border-radius: 10px; margin-top: 18px; background: #fff; }
      code { background: #eef3fb; border-radius: 4px; padding: 1px 4px; } .notice { font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <h1>kkFileView 本机预览演示</h1>
      <p>上传 <code>DOC</code>、<code>DOCX</code>、<code>XLS</code>、<code>XLSX</code> 或 <code>PDF</code>，文件会被发送到本机隔离容器并以只读方式预览。</p>
      <div class="panel">
        <form id="upload-form">
          <div class="actions">
            <input id="file" name="file" type="file" accept=".doc,.docx,.xls,.xlsx,.pdf" required />
            <button id="submit" type="submit">上传并预览</button>
          </div>
        </form>
        <div id="status" aria-live="polite">尚未上传文件。</div>
        <iframe id="preview" title="文件预览" hidden></iframe>
      </div>
      <p class="notice">这是本机 PoC：上传接口没有登录鉴权，容器网络仅用于演示。请只上传脱敏测试文件；关闭容器后示例文件也应一并清理。</p>
    </main>
    <script>
      const form = document.querySelector('#upload-form');
      const file = document.querySelector('#file');
      const button = document.querySelector('#submit');
      const status = document.querySelector('#status');
      const preview = document.querySelector('#preview');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!file.files.length) return;
        button.disabled = true; status.className = ''; status.textContent = '正在上传并准备预览…'; preview.hidden = true;
        try {
          const response = await fetch('/api/upload', { method: 'POST', body: new FormData(form) });
          const data = await response.json();
          if (!response.ok) throw new Error(data.message || '上传失败');
          status.textContent = `正在预览：${data.filename}`;
          preview.src = data.previewUrl; preview.hidden = false;
        } catch (error) {
          status.className = 'error'; status.textContent = error.message || '上传失败';
        } finally { button.disabled = false; }
      });
    </script>
  </body>
</html>
